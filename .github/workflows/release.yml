name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: false
        type: string

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version if provided
        if: ${{ github.event.inputs.version != '' }}
        shell: bash
        run: |
          NEW_VERSION="${{ github.event.inputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/version = \"[^\"]*\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml
          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Set final version
        shell: bash
        run: |
          if [ -z "$VERSION" ]; then
            echo "VERSION=${{ steps.get-version.outputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Commit version update
        if: ${{ github.event.inputs.version != '' }}
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${{ env.VERSION }}"
          git push

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ env.VERSION || steps.get-version.outputs.version }}`,
              name: `v${{ env.VERSION || steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  build-linux:
    permissions:
      contents: write
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Build application
        run: pnpm tauri build --bundles deb,appimage

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: src-tauri/target/release/bundle/

      - name: Get version
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const bundlePath = 'src-tauri/target/release/bundle';

            async function uploadAssets() {
              const files = [];

              // Collect .deb files
              const debPath = path.join(bundlePath, 'deb/x86_64');
              if (fs.existsSync(debPath)) {
                fs.readdirSync(debPath).forEach(file => {
                  if (file.endsWith('.deb')) {
                    files.push(path.join(debPath, file));
                  }
                });
              }

              // Collect AppImage files
              const appImagePath = path.join(bundlePath, 'appimage');
              if (fs.existsSync(appImagePath)) {
                fs.readdirSync(appImagePath).forEach(file => {
                  if (file.endsWith('.AppImage')) {
                    files.push(path.join(appImagePath, file));
                  }
                });
              }

              // Upload each file
              for (const file of files) {
                console.log(`Uploading ${file}...`);
                const fileData = fs.readFileSync(file);
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: ${{ needs.create-release.outputs.release-id }},
                  name: path.basename(file),
                  data: fileData,
                });
              }
            }

            await uploadAssets();

  publish-release:
    permissions:
      contents: write
    needs: [create-release, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
              draft: false,
              prerelease: false
            })
